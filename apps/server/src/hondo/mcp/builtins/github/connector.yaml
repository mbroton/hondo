title: GitHub
description: Pull requests, commits, Actions runs and releases on github.com.
url: https://api.githubcopilot.com/mcp/
headers:
  Authorization: "Bearer {token}"
  # GitHub's default tool groups plus Actions. This chooses which tools load;
  # admins still approve each tool.
  X-MCP-Toolsets: "context,repos,issues,pull_requests,users,actions"
inputs:
  token:
    label: Access token
    secret: true
    help: A fine-grained personal access token. It starts with github_pat_.
setup:
  - If you can, use a separate GitHub account for Hondo. Then the connector keeps working when a person leaves.
  - "In GitHub, open Settings, then Developer settings, then Personal access tokens, then Fine-grained tokens. Select Generate new token."
  - Select the repositories that Hondo can use.
  - "Give Read-only access to Contents, Pull requests, Actions, Checks and Commit statuses. Give write access only to what Hondo can change."
  - If an organization owns the repositories, an organization owner may have to approve the token.
  - The token expires. Before that date, make a new token and enter it on this connector.
