[project]
name = "hondo"
version = "0.1.0"
description = "Hondo — a shared AI teammate that lives in Slack."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.11",
    "pydantic-ai[dbos,openrouter]==2.64.0",
    "pydantic-settings>=2.10",
    "slack-bolt>=1.23",
    "asyncpg>=0.30",
    "logfire-api>=3.0",
    "dbos>=2.26",
    "structlog>=25.1",
    "aiohttp>=3.14.1",
    "alembic>=1.18.5",
    "pydantic-ai-harness[codemode]>=0.36.0",
    "logfire>=3.0",
    # Imported directly by __main__.py — a direct dependency, not a ride on
    # pydantic-settings' transitive requirement.
    "python-dotenv>=1.2.2",
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.49.0",
    "httpx>=0.28.1",
    "httpcore>=1.0.9,<2",
    "mcp>=1.28.1,<2",
    "cryptography>=49.0.0",
    "authlib>=1.7.2",
    "itsdangerous>=2.2.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
hondo = "hondo.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.12",
    "pyright>=1.1.400",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "asyncpg-stubs>=0.30",
    "testcontainers[postgres]>=4.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hondo"]

[tool.logfire]
ignore_no_config = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["I", "UP", "DTZ"]

[tool.ruff.lint.isort]
known-first-party = ["hondo"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: process-level recovery tests excluded from fast local runs"]
testpaths = ["tests"]
