name: Website CI

on:
  push:
    branches: [main]
    paths:
      - "apps/website/**"
      - ".github/workflows/ci-website.yml"
  pull_request:
    paths:
      - "apps/website/**"
      - ".github/workflows/ci-website.yml"

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/website/package-lock.json
      - run: npm ci
      - run: make check
